<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Squire practice room</title>
<style>
  :root { color-scheme: dark; --navy: #0A1324; --ink: #F3EEE2; --ink-2: #B9C0CF; --gold: #D4AF5A; --orange: #F64B19; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--navy); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-inline: 20px; }
  main { max-width: 34rem; display: grid; gap: 12px; }
  .mark { color: var(--orange); font-size: 28px; }
  h1 { margin: 0; font-size: 28px; }
  p { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">✦</span>
  <h1>Squire practice room</h1>
  <p>Opening soon. If someone invited you, use the link they sent once the room opens.</p>
</main>
</body>
</html>
